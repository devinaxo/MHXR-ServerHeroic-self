# Stack COMPLETO del server MHXR: un solo progetto, un solo database.
#
#   docker compose -f docker-compose.prod.yml up -d --build      avvia tutto
#   docker compose -f docker-compose.prod.yml logs -f server      log del server
#   docker compose -f docker-compose.prod.yml stop                spegne
#   docker compose -f docker-compose.prod.yml start               riaccende
#
# MAI "down -v": la -v cancella i volumi, cioe' il database e il personaggio.
# I volumi del database sono dichiarati in fondo a questo file, senza "external".

services:
  mongo:
    image: mongo:8
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - explore
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ./
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 8081, not 80: this host already uses 80/443 (Caddy) and 8080/8096
      # (Jellyfin). version.controller.ts appends any port other than 80/443 to
      # the URLs it hands the client, so this must match PORT in .env.
      - '127.0.0.1:8081:8081'
      - '100.115.13.121:8081:8081'
    volumes:
      # "yarn build" crea dist/public come SYMLINK a ../src/public, ma lo stage
      # di runtime copia solo /app/dist: il mount va su /app/src/public, non su
      # /app/dist/public, altrimenti il link resta rotto e il gioco non scarica.
      #
      # Percorso relativo alla cartella del progetto: cosi' tutto l'occorrente
      # (codice, risorse, script) sta in un'unica cartella spostabile di peso su
      # un altro PC. Prima puntava alla vecchia installazione due cartelle piu'
      # in la', e bastava spostarne una per rompere tutto.
      - './src/public:/app/src/public'
      # Script di manutenzione. Estensione .cjs e non .js: il package.json ha
      # "type": "module", quindi ogni .js sotto /app sarebbe letto come ESM.
      - './tools-js:/app/tools'
    # The container runs as uid 999; the bind-mounted packs belong to the host
    # user, so it can read the .fpk files but cannot create download.list beside
    # them (EACCES, and the client gets no resource manifests). Joining the host
    # user's group is enough -- the pack directories are group-writable -- and
    # avoids touching file ownership. Set HOST_GID in .env if `id` disagrees.
    group_add:
      - '${HOST_GID:-1000}'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - explore

  # Pannello web del database. Ascolta SOLO su localhost: ci arrivi da questo PC
  # su http://localhost:8083 e non e' raggiungibile da internet nemmeno quando
  # aprirai la porta 80 sul router.
  mongo-express:
    image: mongo-express:1.0.2
    restart: always
    ports:
      - '127.0.0.1:8083:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER}:${DB_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - explore

# No "external": those volumes existed only on the original author's machine
# (fixed names apypos-server-main_mongo_*) and compose refused to start
# elsewhere. Note that "down -v" now really does delete them.
volumes:
  mongo_data:
  mongo_config:

networks:
  explore:
    driver: bridge
